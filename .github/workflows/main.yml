name: Python Authentication API CI/CD
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  test: 
    runs-on: ubuntu-latest

    env: 
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TEST_DATABASE_URL: postgresql://user:password@localhost:5432/tests_db
      SECRET_KEY: ${{ secrets.SECRET_KEY }} 
      ALGORITHM: ${{ secrets.ALGORITHM }}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }} 
      RESET_TOKEN_EXPIRE_MINUTES: ${{ secrets.RESET_TOKEN_EXPIRE_MINUTES }} 
      APP_URL: http://localhost:8000 
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }} 
      REFRESH_TOKEN_EXPIRE_DAYS: ${{ secrets.REFRESH_TOKEN_EXPIRE_DAYS }}
      VERIFICATION_TOKEN_EXPIRE_MINUTES: ${{ secrets.VERIFICATION_TOKEN_EXPIRE_MINUTES }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      DISABLE_RATE_LIMITING: "1"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password 
          POSTGRES_DB: tests_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps: 
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python 
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.6'
      - name: Install dependencies 
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Testing 
        run: python -m pytest

  deploy: 
    runs-on: ubuntu-latest 
    needs: test

    env: 
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
      ALGORITHM: ${{ secrets.ALGORITHM }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      RESET_TOKEN_EXPIRE_MINUTES: ${{ secrets.RESET_TOKEN_EXPIRE_MINUTES }}
      APP_URL: ${{ secrets.APP_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      REFRESH_TOKEN_EXPIRE_DAYS: ${{ secrets.REFRESH_TOKEN_EXPIRE_DAYS}}
      VERIFICATION_TOKEN_EXPIRE_MINUTES: ${{ secrets.VERIFICATION_TOKEN_EXPIRE_MINUTES }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          
    steps: 
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.6'

      - name: Install dependencies 
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic database migrations 
        run: |
          alembic upgrade head

      - name: Authentication with Google Cloud Run 
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/247931221656/locations/global/workloadIdentityPools/github-pool/providers/github
          service_account: github-deploy@auth-service-api-486810.iam.gserviceaccount.com

      - name: Set up Cloud SDK 
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Docker Auth 
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev

      - name: Build and Push Container
        run: |-
          docker build -t "asia-northeast1-docker.pkg.dev/${{ vars.PROJECT_ID }}/auth-service-api/auth-service-api:${{ github.sha }}" .
          docker push "asia-northeast1-docker.pkg.dev/${{ vars.PROJECT_ID }}/auth-service-api/auth-service-api:${{ github.sha }}"

      - name: Deploy to Cloud Run
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: auth-service-api
          region: asia-northeast1
          image: asia-northeast1-docker.pkg.dev/${{ vars.PROJECT_ID }}/auth-service-api/auth-service-api:${{ github.sha }}
          flags: '--allow-unauthenticated'
          env_vars: |
            UPSTASH_REDIS_REST_URL=${{ secrets.UPSTASH_REDIS_REST_URL }}
            UPSTASH_REDIS_REST_TOKEN=${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            ALGORITHM=${{ secrets.ALGORITHM }}
            ACCESS_TOKEN_EXPIRE_MINUTES=${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
            RESET_TOKEN_EXPIRE_MINUTES=${{ secrets.RESET_TOKEN_EXPIRE_MINUTES }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            REFRESH_TOKEN_EXPIRE_DAYS=${{ secrets.REFRESH_TOKEN_EXPIRE_DAYS }}
            VERIFICATION_TOKEN_EXPIRE_MINUTES=${{ secrets.VERIFICATION_TOKEN_EXPIRE_MINUTES }}

